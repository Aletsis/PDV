services:
  # ───────────────────────────────────────────────────────────
  # Aplicación Web: PDV Blazor WebUI Server
  # ───────────────────────────────────────────────────────────
  webui:
    image: pdv-webui:latest
    container_name: pdv-web-app
    build:
      context: .
      dockerfile: src/PDV.WebUI/Dockerfile
    restart: always
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - RunMode=${RunMode:-Server}
      - ConnectionStrings__DefaultConnection=${DEFAULT_CONNECTION:-Host=localhost;Database=pdv_db;Username=pdv_user;Password=TuContrasenaAltamenteSegura123!}
      - APPLY_MIGRATIONS=${APPLY_MIGRATIONS:-true}
      - REQUIRE_NO_PENDING_MIGRATIONS=${REQUIRE_NO_PENDING_MIGRATIONS:-false}
    volumes:
      - webui-logs:/app/Logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  webui-logs:
    driver: local
